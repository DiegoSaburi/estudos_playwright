[tool.pytest.ini_options]
addopts = [
    "--headed",
    "--tracing", "retain-on-failure",
    "--video", "retain-on-failure",
    "--screenshot", "only-on-failure",

    "--alluredir", "results/allure-results",
    "--html", "results/report.html",
    "--self-contained-html",

    "--output", "results/test-results",
]